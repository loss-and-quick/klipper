# Creality K1 - macros
#
# Minimal macros: sensorless XY homing plus load-cell Z homing.

[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params
                    and 'Y' not in params and 'Z' not in params %}

  {% if home_all or 'X' in params %}
    _HOME_AXIS AXIS=X RETRACT=-10
  {% endif %}

  {% if home_all or 'Y' in params %}
    _HOME_AXIS AXIS=Y RETRACT=10
  {% endif %}

  {% if home_all or 'Z' in params %}
    # Z is probed at the bed centre - X and Y must already be homed
    {% set x_mid = printer.configfile.settings.stepper_x.position_max / 2 %}
    {% set y_mid = printer.configfile.settings.stepper_y.position_max / 2 %}
    G90
    G0 X{x_mid} Y{y_mid} F6000
    G28 Z
    G0 Z5 F600
  {% endif %}

# Home one sensorless axis, then back off and let StallGuard settle.  A
# nested G28 inside [homing_override] performs the real kinematic homing.
[gcode_macro _HOME_AXIS]
gcode:
  {% set axis = params.AXIS %}
  {% set retract = params.RETRACT|float %}
  G28 {axis}
  G91
  G0 {axis}{retract} F3600
  G90
  G4 P2000

[gcode_macro START_PRINT]
gcode:
  {% set BED = params.BED|default(60)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(220)|float %}
  M140 S{BED}
  M104 S{EXTRUDER}
  M190 S{BED}
  M109 S{EXTRUDER}
  G28
  BED_MESH_CALIBRATE
  G90
  G1 Z5 F600

[gcode_macro END_PRINT]
gcode:
  M104 S0
  M140 S0
  M106 S0
  G91
  G1 Z10 F600
  G90
  M84
