# Creality K1 - Klipper configuration
#
# Bed probing uses [load_cell_probe] with the four HX711 load cells summed
# into one signal, so the probe triggers on real grams of force and is
# calibrated with LOAD_CELL_CALIBRATE.
#
# Micro-controllers:
#   mcu           GD32F303RET6   /dev/ttyS7
#   nozzle_mcu    GD32F303CBT6   /dev/ttyS1
#   leveling_mcu  GD32E230F8P6   /dev/ttyS9   (reads the 4 HX711 load cells)
#
# Values marked "TUNE" must be verified/adjusted on the actual machine.

[include macros.cfg]

#####################################################################
#   Micro-controllers
#####################################################################

[mcu]
serial: /dev/ttyS7
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[mcu leveling_mcu]
serial: /dev/ttyS9
baud: 230400
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
max_z_velocity: 20
max_z_accel: 300
square_corner_velocity: 5.0

#####################################################################
#   Steppers (sensorless homing via TMC2209 StallGuard)
#####################################################################

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32
rotation_distance: 72
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 229
position_min: -5
position_max: 229
homing_speed: 36
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PA9
interpolate: True
run_current: 1.5
hold_current: 1.0
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address: 3
diag_pin: ^PB12
driver_SGTHRS: 65   # TUNE: sensorless X sensitivity

[stepper_y]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
microsteps: 32
rotation_distance: 72
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -0.5
position_min: -0.5
position_max: 226
homing_speed: 36
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PA10
interpolate: True
run_current: 1.5
hold_current: 1.0
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address: 3
diag_pin: ^PB13
driver_SGTHRS: 65   # TUNE: sensorless Y sensitivity

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
gear_ratio: 64:20
# Z is homed downwards onto the bed with the load cell probe
endstop_pin: probe:z_virtual_endstop
position_max: 255
position_min: -5

[tmc2209 stepper_z]
uart_pin: PA11
uart_address: 3
run_current: 0.8
sense_resistor: 0.100
stealthchop_threshold: 0

#####################################################################
#   Extruder & bed
#####################################################################

[extruder]
step_pin: nozzle_mcu:PB1
dir_pin: nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 80
heater_pin: nozzle_mcu:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
control: pid
pid_Kp: 25.013
pid_Ki: 2.566
pid_Kd: 60.966
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
uart_address: 3
run_current: 0.55
sense_resistor: 0.150
stealthchop_threshold: 0

[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: watermark
min_temp: 0
max_temp: 115

[verify_heater extruder]

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

#####################################################################
#   Load cell probe
#####################################################################

# The four HX711 chips live on the leveling MCU, one per bed mount.  The
# hx711 sensor sums them so the trigger force does not depend on the XY
# contact point.  One clk/dout pair per cell:
#   cell0 clk PA5 / dout PA1   cell1 clk PA2 / dout PA0
#   cell2 clk PA6 / dout PA3   cell3 clk PA7 / dout PA4
[load_cell_probe]
sensor_type: hx711
sclk_pins: leveling_mcu:PA5, leveling_mcu:PA2, leveling_mcu:PA6, leveling_mcu:PA7
dout_pins: leveling_mcu:PA1, leveling_mcu:PA0, leveling_mcu:PA3, leveling_mcu:PA4
sample_rate: 80
z_offset: 0.0            # TUNE: set after first calibration
trigger_force: 75        # grams of force - TUNE
# counts_per_gram / reference_tare_counts are written by LOAD_CELL_CALIBRATE

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 5, 5
mesh_max: 215, 215
probe_count: 5, 5
fade_start: 5.0
fade_end: 50.0

#####################################################################
#   Fans
#####################################################################

[fan]
# Part cooling fan
pin: !nozzle_mcu:PB8
cycle_time: 0.0100
hardware_pwm: false

[multi_pin heater_fans]
pins: nozzle_mcu:PB5, nozzle_mcu:PB2

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 40

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 125

[temperature_fan chamber_fan]
pin: PC0
cycle_time: 0.0100
hardware_pwm: false
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: watermark
max_delta: 2
min_temp: 0
max_temp: 70
target_temp: 35.0
max_speed: 1.0
min_speed: 0.0

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[output_pin LED]
pin: PB0
pwm: True
cycle_time: 0.010
value: 1

#####################################################################
#   Filament sensors
#####################################################################

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !PC15

[filament_switch_sensor filament_sensor_2]
pause_on_runout: true
switch_pin: !nozzle_mcu:PA10

#####################################################################
#   Resonance testing (input shaper)
#####################################################################

[adxl345]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,-z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 75
probe_points:
    110, 110, 10

#####################################################################
#   Misc
#####################################################################

[force_move]
enable_force_move: true

[gcode_arcs]
resolution: 1.0

[exclude_object]

[idle_timeout]
timeout: 1800
